name: vllm-clinical-rag
channels:
  - main         # all packages — faiss-gpu, gradio, evidently, fastapi
  - defaults

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests
  - beautifulsoup4
  - lxml

  # ── Retrieval ──────────────────────────────────────────────────────────────
  # sentence-transformers and transformers removed — embeddings served locally
  # by Anaconda Desktop (Qwen3-Embedding-4B). No HuggingFace Hub calls.
  - faiss-gpu          # Anaconda main (linux-64) — requires NVIDIA GPU

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi
  - "uvicorn[standard]"
  - pydantic

  # ── Demo UI ────────────────────────────────────────────────────────────────
  - gradio             # Anaconda main

  # ── Evaluation & monitoring ────────────────────────────────────────────────
  - evidently          # Anaconda main (added Q1 2026) — RAG evaluation + monitoring

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - python-dotenv
  - tqdm
  - rich

  # No pip dependencies. No HuggingFace packages.
  # All model inference (embeddings + generation) goes through Anaconda Desktop
  # at localhost:8080 — fully audited, supply-chain clean.
