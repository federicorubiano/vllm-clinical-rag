name: vllm-clinical-rag
channels:
  - main         # faiss-cpu, sentence-transformers, gradio, rank-bm25
  - defaults
  # main-x: not required — none of the demo packages are gated behind it
  # vllm is pip-only (see pip section below)

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests
  - beautifulsoup4
  - lxml
  - tiktoken

  # ── Embeddings & retrieval ─────────────────────────────────────────────────
  - sentence-transformers
  - faiss-gpu          # High-value package from Anaconda main-x — requires NVIDIA GPU
  - rank-bm25

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi
  - "uvicorn[standard]"
  - pydantic

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - python-dotenv
  - tqdm
  - rich

  # ── Inference ─────────────────────────────────────────────────────────────
  # vllm CPU is on Anaconda main (linux-64). GPU build in progress — blocked
  # by build platform issues. Using pip for GPU until conda package is ready.
  - pip:
    - vllm               # GPU version: pip fallback until conda GPU build ships
    - evidently          # RAG evaluation + monitoring
    - openai             # OpenAI-compatible client for vLLM
    - mcp                # MCP server protocol
