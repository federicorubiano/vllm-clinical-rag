name: anaconda-clinical-rag
# ─────────────────────────────────────────────────────────────────────────────
# Runs locally on Mac (Apple Silicon) or any CPU-only machine. No GPU required.
# Versions pinned exactly against the Anaconda `main` channel (verified 2026-06).
# For a deterministic, hash-locked build:
#   conda-lock -f environment.yml -p osx-arm64
# ─────────────────────────────────────────────────────────────────────────────
channels:
  - main
  - defaults

dependencies:
  - python=3.12

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests==2.34.2
  - beautifulsoup4==4.15.0
  - lxml==6.1.0

  # ── Retrieval ──────────────────────────────────────────────────────────────
  # Embeddings are served by Anaconda Desktop (Qwen3-Embedding-8B), not installed here.
  - faiss-cpu==1.14.1          # CPU build — works on Mac/Linux without an NVIDIA GPU

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi==0.135.4
  - uvicorn==0.40.0
  - pydantic==2.13.4

  # ── Demo UI ────────────────────────────────────────────────────────────────
  - gradio==6.14.0

  # ── Evaluation & monitoring ────────────────────────────────────────────────
  - evidently==0.7.21          # Anaconda main — RAG evaluation + monitoring

  # ── Dev tooling ─────────────────────────────────────────────────────────────
  - jupyter==1.1.1
  - ipykernel==7.2.0
  - python-dotenv==1.2.1
  - tqdm==4.68.2
  - rich==15.0.0

  # All packages come from the Anaconda main channel. Model inference
  # (embeddings + generation) is served by Anaconda Desktop.
