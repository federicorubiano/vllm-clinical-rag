name: vllm-clinical-rag
channels:
  - main         # all packages — faiss-gpu, sentence-transformers, gradio, evidently, rank-bm25
  - defaults
  # vllm GPU is pip-only until the conda GPU build ships (see pip section below)

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests
  - beautifulsoup4
  - lxml

  # ── Embeddings & retrieval ─────────────────────────────────────────────────
  - sentence-transformers
  - faiss-gpu          # Anaconda main (linux-64) — requires NVIDIA GPU
  - rank-bm25

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi
  - "uvicorn[standard]"
  - pydantic

  # ── Demo UI ────────────────────────────────────────────────────────────────
  - gradio             # Anaconda main

  # ── Evaluation & monitoring ────────────────────────────────────────────────
  - evidently          # Anaconda main (added Q1 2026) — RAG evaluation + monitoring

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - python-dotenv
  - tqdm
  - rich

  # ── Inference ─────────────────────────────────────────────────────────────
  # vllm CPU is on Anaconda main (linux-64). GPU build in progress — blocked
  # by build platform issues. Using pip for GPU until conda package is ready.
  - pip:
    - vllm               # GPU version: pip fallback until conda GPU build ships
