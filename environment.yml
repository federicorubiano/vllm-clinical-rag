name: vllm-clinical-rag
channels:
  - main-x      # Anaconda early-access channel (vLLM, FAISS-GPU)
  - main
  - defaults

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests
  - beautifulsoup4
  - lxml
  - tiktoken

  # ── Embeddings & retrieval ─────────────────────────────────────────────────
  - sentence-transformers
  - faiss-gpu          # High-value package from Anaconda main-x — requires NVIDIA GPU
  - rank-bm25

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi
  - "uvicorn[standard]"
  - pydantic

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - python-dotenv
  - tqdm
  - rich

  # ── pip-only packages ──────────────────────────────────────────────────────
  - pip:
    - vllm               # High-value package — requires CUDA GPU (16GB+ VRAM)
    - evidently          # RAG evaluation + monitoring
    - gradio             # Demo UI
    - openai             # OpenAI-compatible client for vLLM
    - mcp                # MCP server protocol
