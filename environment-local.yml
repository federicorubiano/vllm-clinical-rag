name: vllm-rag
# ─────────────────────────────────────────────────────────────────────────────
# LOCAL / MAC DEVELOPMENT ENVIRONMENT
# Use this on any machine, including MacBook (Apple Silicon or Intel).
#
#   conda env create -f environment-local.yml
#   conda activate vllm-rag
#
# Inference and embeddings are handled by Anaconda Desktop's local model server
# (localhost:8080) — no GPU required in this environment, no HuggingFace Hub.
#
# What you CAN do locally with this env:
#   ✅  python scripts/scraper.py           — scrape Merck Manual
#   ✅  python scripts/build_index.py       — build FAISS index (via Desktop)
#   ✅  uvicorn src.api:app --reload        — run the full API (via Desktop)
#   ✅  python src/gradio_app.py            — launch demo UI
#   ✅  python test_api.py                  — connectivity test
#   ✅  python eval/run_eval.py             — run evaluation harness
#
# Prerequisites:
#   - Anaconda Desktop installed and running
#   - Qwen3-Embedding-4B loaded as model server in Desktop
#   - Qwen3-8B loaded as model server in Desktop
# ─────────────────────────────────────────────────────────────────────────────
channels:
  - main         # all packages — faiss-cpu, gradio, evidently
  - defaults

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests
  - beautifulsoup4
  - lxml

  # ── Retrieval ──────────────────────────────────────────────────────────────
  # sentence-transformers removed — embeddings via Anaconda Desktop API
  - faiss-cpu          # CPU build — works on Mac/Linux without NVIDIA GPU

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi
  - "uvicorn[standard]"
  - pydantic

  # ── Demo UI ────────────────────────────────────────────────────────────────
  - gradio             # Anaconda main

  # ── Evaluation & monitoring ────────────────────────────────────────────────
  - evidently          # Anaconda main (added Q1 2026) — RAG evaluation + monitoring

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - python-dotenv
  - tqdm
  - rich

  # No pip dependencies. No HuggingFace packages.
  # Model inference goes through Anaconda Desktop at localhost:8080.
