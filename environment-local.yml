name: vllm-rag
# ─────────────────────────────────────────────────────────────────────────────
# LOCAL / MAC DEVELOPMENT ENVIRONMENT
# Use this on any machine without an NVIDIA GPU (MacBook, CI, etc.)
#
#   conda env create -f environment-local.yml
#   conda activate vllm-rag
#
# Differences from environment.yml (GPU/Outerbounds):
#   - faiss-cpu  instead of  faiss-gpu
#   - vllm omitted  (no GPU — run via ana ob deploy)
#
# What you CAN do locally with this env:
#   ✅  python scripts/scraper.py       — scrape Merck Manual
#   ✅  python scripts/build_index.py   — build FAISS index
#   ✅  python test_api.py --url <endpoint>  — test a remote API
#   ✅  python eval/run_eval.py --api-url <endpoint>
#   ❌  bash scripts/start_vllm.sh      — needs GPU (use ana ob deploy)
# ─────────────────────────────────────────────────────────────────────────────
channels:
  - main         # all packages — faiss-cpu, sentence-transformers, gradio, evidently
  - defaults

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests
  - beautifulsoup4
  - lxml

  # ── Embeddings & retrieval ─────────────────────────────────────────────────
  - sentence-transformers
  - faiss-cpu          # CPU fallback — works on Mac/Linux without NVIDIA GPU

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi
  - "uvicorn[standard]"
  - pydantic

  # ── Demo UI ────────────────────────────────────────────────────────────────
  - gradio             # Anaconda main

  # ── Evaluation & monitoring ────────────────────────────────────────────────
  - evidently          # Anaconda main (added Q1 2026) — RAG evaluation + monitoring

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - python-dotenv
  - tqdm
  - rich

  # No pip dependencies — all packages from Anaconda main channel.
  # vllm intentionally omitted — no GPU locally. Deploy with: ana ob deploy
