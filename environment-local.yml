name: vllm-rag
# ─────────────────────────────────────────────────────────────────────────────
# LOCAL / MAC DEVELOPMENT ENVIRONMENT
# Use this on any machine, including MacBook (Apple Silicon or Intel).
#
#   conda env create -f environment-local.yml
#   conda activate vllm-rag
#
# Inference and embeddings are handled by Anaconda Desktop's local model server
# (localhost:8080) — no GPU required in this environment, no HuggingFace Hub.
#
# Versions pinned exactly against the Anaconda `main` channel (verified 2026-06).
# For a deterministic, hash-locked build:
#   conda-lock -f environment-local.yml -p osx-arm64
#
# Prerequisites:
#   - Anaconda Desktop installed and running
#   - Qwen3-Embedding-4B loaded as a model server in Desktop (for indexing)
#   - Qwen3-8B loaded as a model server in Desktop (for inference)
# ─────────────────────────────────────────────────────────────────────────────
channels:
  - main
  - defaults

dependencies:
  - python=3.11

  # ── Data pipeline ──────────────────────────────────────────────────────────
  - requests==2.34.2
  - beautifulsoup4==4.15.0
  - lxml==6.1.0

  # ── Retrieval ──────────────────────────────────────────────────────────────
  # sentence-transformers removed — embeddings via Anaconda Desktop API
  - faiss-cpu==1.14.1          # CPU build — works on Mac/Linux without NVIDIA GPU

  # ── API layer ──────────────────────────────────────────────────────────────
  - fastapi==0.135.4
  - uvicorn==0.40.0
  - pydantic==2.13.4

  # ── Demo UI ────────────────────────────────────────────────────────────────
  - gradio==6.14.0

  # ── Evaluation & monitoring ────────────────────────────────────────────────
  - evidently==0.7.21          # Anaconda main — RAG evaluation + monitoring

  # ── Dev tooling ─────────────────────────────────────────────────────────────
  - jupyter==1.1.1
  - ipykernel==7.2.0
  - python-dotenv==1.2.1
  - tqdm==4.68.2
  - rich==15.0.0

  # No pip dependencies. No HuggingFace packages.
  # Model inference goes through Anaconda Desktop at localhost:8080.
